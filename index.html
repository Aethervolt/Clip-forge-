<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ClipForge — Browser Video Editor</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            forge: {
              bg: '#0b0d12',
              panel: '#12151e',
              surface: '#1a1e2b',
              hover: '#232838',
              border: '#272c3d',
              accent: '#00d4aa',
              accentHover: '#00f0c0',
              purple: '#7c5cff',
              amber: '#f59e0b',
              rose: '#f43f5e',
            }
          }
        }
      }
    };
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0b0d12;
      color: #e5e7eb;
      font-family: 'Inter', system-ui, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    /* Custom subtle scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #12151e; }
    ::-webkit-scrollbar-thumb { background: #2d3348; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f4763; }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: #272c3d;
      height: 4px;
      border-radius: 9999px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #00d4aa;
      cursor: pointer;
      border: 2px solid #0b0d12;
      box-shadow: 0 0 0 1px rgba(0, 212, 170, 0.4);
    }
    .clip-handle {
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    .timeline-clip:hover .clip-handle,
    .timeline-clip.selected .clip-handle {
      opacity: 1;
    }
    .timeline-clip.selected {
      box-shadow: 0 0 0 2px #00d4aa, 0 4px 12px rgba(0, 212, 170, 0.2);
      z-index: 15;
    }
    .timeline-clip, #playheadHandle, #timeRuler {
      touch-action: none;
    }
    @media (max-width: 767px) {
      .clip-handle { opacity: 0.75; }
    }
  </style>
</head>
<body class="h-[100dvh] w-screen flex flex-col bg-forge-bg text-gray-100 overflow-hidden">

  <!-- HOME MENU VIEW (Default Launch Screen) -->
  <div id="homeView" class="flex-1 overflow-y-auto bg-[#f8fafc] text-slate-900">
    <div class="max-w-lg mx-auto min-h-full flex flex-col px-4 pt-4 pb-8">
      <!-- Top Bar -->
      <div class="flex items-center justify-between mb-4">
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-slate-200/80 text-xs font-semibold text-slate-800">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00b894" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <span>ClipForge Free</span>
        </div>
        <div class="flex items-center gap-2">
          <button id="homeSearchToggleBtn" title="Search Projects" class="p-2 rounded-full hover:bg-slate-200/70 text-slate-700 transition">
            <i data-lucide="search" class="w-5 h-5"></i>
          </button>
          <button id="homeSettingsBtn" title="Editor Info" class="p-2 rounded-full hover:bg-slate-200/70 text-slate-700 transition">
            <i data-lucide="settings" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <!-- Optional Search Bar -->
      <div id="homeSearchWrap" class="hidden mb-3">
        <input id="homeSearchInput" type="text" placeholder="Search your projects..." class="w-full px-3.5 py-2 rounded-xl bg-white border border-slate-200 text-sm text-slate-800 outline-none focus:border-teal-500 shadow-sm" />
      </div>

      <!-- Hero Bento Grid (New Video + Edit Photo + 2 Quick Cards) -->
      <div class="grid grid-cols-12 gap-2.5 mb-4">
        <button id="homeNewVideoBtn" class="col-span-5 h-36 rounded-2xl bg-gradient-to-br from-cyan-300 via-sky-300 to-teal-200 hover:brightness-95 active:scale-[0.99] transition p-3 flex flex-col items-center justify-center gap-2 shadow-sm text-slate-900">
          <div class="w-9 h-9 rounded-xl bg-slate-900 text-white flex items-center justify-center shadow">
            <i data-lucide="plus" class="w-5 h-5"></i>
          </div>
          <span class="font-semibold text-sm">New video</span>
        </button>

        <button id="homeEditPhotoBtn" class="col-span-3 h-36 rounded-2xl bg-gradient-to-br from-sky-200 via-cyan-200 to-teal-300 hover:brightness-95 active:scale-[0.99] transition p-2.5 flex flex-col items-center justify-center gap-2 shadow-sm text-slate-900">
          <div class="w-8 h-8 rounded-xl bg-slate-900 text-white flex items-center justify-center shadow">
            <i data-lucide="image" class="w-4 h-4"></i>
          </div>
          <span class="font-semibold text-xs text-center leading-tight">Edit<br/>photo</span>
        </button>

        <div class="col-span-4 h-36 flex flex-col gap-2.5">
          <button data-home-tool="poster" class="flex-1 rounded-2xl bg-slate-100 hover:bg-slate-200/80 border border-slate-200/70 px-3 flex items-center gap-2 text-left transition">
            <i data-lucide="sparkles" class="w-4 h-4 text-slate-800 shrink-0"></i>
            <span class="text-xs font-medium text-slate-800 leading-tight">Poster FX</span>
          </button>
          <button data-home-tool="textcard" class="flex-1 rounded-2xl bg-slate-100 hover:bg-slate-200/80 border border-slate-200/70 px-3 flex items-center gap-2 text-left transition">
            <i data-lucide="type" class="w-4 h-4 text-slate-800 shrink-0"></i>
            <span class="text-xs font-medium text-slate-800 leading-tight">Text card</span>
          </button>
        </div>
      </div>

      <!-- 4x2 Quick Tools Grid -->
      <div class="grid grid-cols-4 gap-2.5 mb-6">
        <button data-home-tool="quickcut" class="flex flex-col items-center gap-1.5 group">
          <div class="w-full aspect-[4/3] rounded-2xl bg-slate-100 group-hover:bg-slate-200/80 border border-slate-200/60 flex items-center justify-center transition">
            <i data-lucide="scissors" class="w-5 h-5 text-slate-800"></i>
          </div>
          <span class="text-[11px] font-medium text-slate-700 text-center">Quick Cut</span>
        </button>
        <button data-home-tool="retouch" class="flex flex-col items-center gap-1.5 group">
          <div class="w-full aspect-[4/3] rounded-2xl bg-slate-100 group-hover:bg-slate-200/80 border border-slate-200/60 flex items-center justify-center transition">
            <i data-lucide="wand-2" class="w-5 h-5 text-slate-800"></i>
          </div>
          <span class="text-[11px] font-medium text-slate-700 text-center">Retouch</span>
        </button>
        <button data-home-tool="motion" class="flex flex-col items-center gap-1.5 group">
          <div class="w-full aspect-[4/3] rounded-2xl bg-slate-100 group-hover:bg-slate-200/80 border border-slate-200/60 flex items-center justify-center transition">
            <i data-lucide="film" class="w-5 h-5 text-slate-800"></i>
          </div>
          <span class="text-[11px] font-medium text-slate-700 text-center">Motion Gen</span>
        </button>
        <button data-home-tool="captions" class="flex flex-col items-center gap-1.5 group">
          <div class="w-full aspect-[4/3] rounded-2xl bg-slate-100 group-hover:bg-slate-200/80 border border-slate-200/60 flex items-center justify-center transition">
            <i data-lucide="captions" class="w-5 h-5 text-slate-800"></i>
          </div>
          <span class="text-[11px] font-medium text-slate-700 text-center">Captions</span>
        </button>
        <button data-home-tool="photostudio" class="flex flex-col items-center gap-1.5 group">
          <div class="w-full aspect-[4/3] rounded-2xl bg-slate-100 group-hover:bg-slate-200/80 border border-slate-200/60 flex items-center justify-center transition">
            <i data-lucide="image-plus" class="w-5 h-5 text-slate-800"></i>
          </div>
          <span class="text-[11px] font-medium text-slate-700 text-center">Photo studio</span>
        </button>
        <button data-home-tool="cover" class="flex flex-col items-center gap-1.5 group">
          <div class="w-full aspect-[4/3] rounded-2xl bg-slate-100 group-hover:bg-slate-200/80 border border-slate-200/60 flex items-center justify-center transition">
            <i data-lucide="layout-template" class="w-5 h-5 text-slate-800"></i>
          </div>
          <span class="text-[11px] font-medium text-slate-700 text-center">Cover maker</span>
        </button>
        <button data-home-tool="timeline" class="flex flex-col items-center gap-1.5 group">
          <div class="w-full aspect-[4/3] rounded-2xl bg-slate-100 group-hover:bg-slate-200/80 border border-slate-200/60 flex items-center justify-center transition">
            <i data-lucide="monitor-play" class="w-5 h-5 text-slate-800"></i>
          </div>
          <span class="text-[11px] font-medium text-slate-700 text-center">Pro timeline</span>
        </button>
        <button id="homeAllToolsBtn" class="flex flex-col items-center gap-1.5 group">
          <div class="w-full aspect-[4/3] rounded-2xl bg-slate-100 group-hover:bg-slate-200/80 border border-slate-200/60 flex items-center justify-center transition">
            <i data-lucide="layout-grid" class="w-5 h-5 text-slate-800"></i>
          </div>
          <span class="text-[11px] font-medium text-slate-700 text-center flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-rose-500 inline-block"></span>
            All tools
          </span>
        </button>
      </div>

      <!-- Projects Section -->
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-base font-bold text-slate-900">Projects</h2>
        <div class="flex items-center gap-2">
          <button id="homeNewProjectChip" class="px-2.5 py-1 rounded-lg bg-sky-50 border border-sky-200 text-sky-700 text-xs font-semibold flex items-center gap-1 hover:bg-sky-100 transition">
            <i data-lucide="folder-plus" class="w-3.5 h-3.5"></i>
            <span>Local</span>
          </button>
        </div>
      </div>

      <div id="homeProjectsList" class="flex-1 flex flex-col gap-2">
        <!-- Populated dynamically by JS -->
      </div>
    </div>
  </div>

  <!-- EDITOR STUDIO VIEW -->
  <div id="studioView" class="hidden flex-1 flex flex-col min-h-0 overflow-hidden">

  <!-- TOP HEADER BAR -->
  <header class="h-12 shrink-0 bg-forge-panel border-b border-forge-border px-3 flex items-center justify-between gap-2 z-30">
    <div class="flex items-center gap-3 min-w-0">
      <!-- Back to Home + Original ClipForge Logo -->
      <button id="backToHomeBtn" title="Back to Home Menu" class="p-1.5 rounded-lg bg-forge-surface hover:bg-forge-hover border border-forge-border text-gray-300 hover:text-white transition shrink-0">
        <i data-lucide="chevron-left" class="w-4 h-4"></i>
      </button>
      <div class="flex items-center gap-2 shrink-0">
        <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-forge-accent to-forge-purple flex items-center justify-center shadow-md shadow-forge-accent/20">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0b0d12" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
        </div>
        <span class="font-bold tracking-tight text-sm sm:text-base text-white">Clip<span class="text-forge-accent">Forge</span></span>
      </div>

      <div class="h-4 w-px bg-forge-border hidden sm:block"></div>

      <input id="projectTitleInput" type="text" value="Neon Launch Reel" aria-label="Project Name"
        class="bg-transparent hover:bg-forge-surface focus:bg-forge-surface text-xs sm:text-sm font-medium text-gray-200 px-1.5 sm:px-2 py-1 rounded border border-transparent focus:border-forge-accent outline-none w-24 sm:w-44 truncate transition" />
    </div>

    <div class="flex items-center gap-1.5 sm:gap-2">
      <!-- Aspect Ratio Selector -->
      <div class="flex items-center bg-forge-surface rounded-lg p-0.5 border border-forge-border">
        <button data-ratio="16:9" class="ratio-btn px-2 py-1 text-[11px] font-medium rounded-md transition bg-forge-accent text-forge-bg">16:9</button>
        <button data-ratio="9:16" class="ratio-btn px-2 py-1 text-[11px] font-medium rounded-md transition text-gray-400 hover:text-white">9:16</button>
        <button data-ratio="1:1" class="ratio-btn px-2 py-1 text-[11px] font-medium rounded-md transition text-gray-400 hover:text-white hidden sm:inline-block">1:1</button>
        <button data-ratio="4:5" class="ratio-btn px-2 py-1 text-[11px] font-medium rounded-md transition text-gray-400 hover:text-white hidden md:inline-block">4:5</button>
      </div>

      <!-- Undo / Redo -->
      <button id="undoBtn" title="Undo (Ctrl+Z)" class="p-1.5 rounded-lg bg-forge-surface hover:bg-forge-hover border border-forge-border text-gray-300 disabled:opacity-40 transition">
        <i data-lucide="undo-2" class="w-4 h-4"></i>
      </button>
      <button id="redoBtn" title="Redo (Ctrl+Y)" class="p-1.5 rounded-lg bg-forge-surface hover:bg-forge-hover border border-forge-border text-gray-300 disabled:opacity-40 transition">
        <i data-lucide="redo-2" class="w-4 h-4"></i>
      </button>

      <!-- Export Button -->
      <button id="openExportBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-forge-accent hover:bg-forge-accentHover text-forge-bg font-semibold text-xs sm:text-sm transition shadow-lg shadow-forge-accent/20">
        <i data-lucide="download" class="w-3.5 h-3.5"></i>
        <span>Export</span>
      </button>
    </div>
  </header>

  <!-- MAIN WORKSPACE (3-Column Top + Bottom Timeline) -->
  <div class="flex-1 flex flex-col min-h-0">
    <!-- UPPER STUDIO AREA -->
    <div class="flex-1 flex min-h-0 overflow-hidden">

      <!-- LEFT TOOL DOCK + ASSET LIBRARY -->
      <aside id="assetDockPanel" class="hidden md:flex fixed md:static inset-0 top-12 z-40 w-full md:w-72 lg:w-80 shrink-0 bg-forge-panel border-r border-forge-border min-h-0">
        <!-- Vertical Icon Rail -->
        <nav class="w-14 shrink-0 border-r border-forge-border flex flex-col items-center py-2 gap-1 bg-forge-bg/40">
          <button data-tab="media" class="dock-tab w-11 py-2 rounded-lg flex flex-col items-center gap-1 text-[10px] font-medium transition bg-forge-surface text-forge-accent">
            <i data-lucide="film" class="w-4 h-4"></i>
            <span>Media</span>
          </button>
          <button data-tab="audio" class="dock-tab w-11 py-2 rounded-lg flex flex-col items-center gap-1 text-[10px] font-medium transition text-gray-400 hover:text-white hover:bg-forge-surface/60">
            <i data-lucide="music" class="w-4 h-4"></i>
            <span>Audio</span>
          </button>
          <button data-tab="text" class="dock-tab w-11 py-2 rounded-lg flex flex-col items-center gap-1 text-[10px] font-medium transition text-gray-400 hover:text-white hover:bg-forge-surface/60">
            <i data-lucide="type" class="w-4 h-4"></i>
            <span>Text</span>
          </button>
          <button data-tab="filters" class="dock-tab w-11 py-2 rounded-lg flex flex-col items-center gap-1 text-[10px] font-medium transition text-gray-400 hover:text-white hover:bg-forge-surface/60">
            <i data-lucide="sparkles" class="w-4 h-4"></i>
            <span>Filters</span>
          </button>
          <button data-tab="transitions" class="dock-tab w-11 py-2 rounded-lg flex flex-col items-center gap-1 text-[10px] font-medium transition text-gray-400 hover:text-white hover:bg-forge-surface/60">
            <i data-lucide="blend" class="w-4 h-4"></i>
            <span>Trans.</span>
          </button>
        </nav>

        <!-- Tab Content Area -->
        <div class="flex-1 flex flex-col min-w-0 min-h-0">
          <div class="md:hidden h-10 px-3 border-b border-forge-border flex items-center justify-between shrink-0">
            <span class="text-xs font-semibold uppercase tracking-wider text-gray-300">Assets & Tools</span>
            <button id="closeDockBtn" class="p-1 rounded-lg bg-forge-surface text-gray-300 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
          <div id="dockContent" class="flex-1 p-3 overflow-y-auto min-w-0">
          <!-- Populated dynamically by JS -->
          </div>
        </div>
      </aside>

      <!-- CENTER PREVIEW PLAYER -->
      <main class="flex-1 flex flex-col min-w-0 bg-forge-bg relative">
        <div id="previewContainer" class="flex-1 flex items-center justify-center p-3 sm:p-5 min-h-0 overflow-hidden">
          <div class="relative flex items-center justify-center max-w-full max-h-full shadow-2xl rounded-lg overflow-hidden ring-1 ring-forge-border bg-black">
            <canvas id="previewCanvas" width="960" height="540" class="block max-w-full max-h-full object-contain"></canvas>
            <div id="aspectBadge" class="absolute top-2 left-2 px-1.5 py-0.5 rounded bg-black/60 backdrop-blur text-[10px] font-mono text-gray-300 pointer-events-none">16:9</div>
          </div>
        </div>

        <!-- Transport Controls Bar -->
        <div class="h-11 shrink-0 bg-forge-panel/90 border-t border-forge-border px-2.5 sm:px-4 flex items-center justify-between gap-2">
          <div class="flex items-center gap-1.5 sm:gap-2 font-mono text-[11px] sm:text-xs text-gray-300 min-w-0">
            <button id="toggleDockBtn" title="Open Assets & Tools" class="md:hidden px-2 py-1 rounded-md bg-forge-surface border border-forge-border text-forge-accent text-[11px] font-sans font-semibold flex items-center gap-1 shrink-0">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
              <span>Add</span>
            </button>
            <span id="currentTimeDisplay" class="text-forge-accent font-medium">00:00.0</span>
            <span class="text-gray-600 hidden sm:inline">/</span>
            <span id="totalDurationDisplay" class="text-gray-400 hidden sm:inline">00:12.0</span>
          </div>

          <div class="flex items-center gap-1.5">
            <button id="jumpStartBtn" title="Jump to Start" class="p-1.5 rounded-md hover:bg-forge-surface text-gray-300 hover:text-white transition">
              <i data-lucide="skip-back" class="w-4 h-4"></i>
            </button>
            <button id="playPauseBtn" title="Play / Pause (Space)" class="w-8 h-8 rounded-full bg-forge-accent hover:bg-forge-accentHover text-forge-bg flex items-center justify-center transition shadow-md shadow-forge-accent/20">
              <i id="playPauseIcon" data-lucide="play" class="w-4 h-4 fill-current"></i>
            </button>
            <button id="jumpEndBtn" title="Jump to End" class="p-1.5 rounded-md hover:bg-forge-surface text-gray-300 hover:text-white transition">
              <i data-lucide="skip-forward" class="w-4 h-4"></i>
            </button>
          </div>

          <div class="flex items-center justify-end gap-2 w-36">
            <button id="muteBtn" title="Mute / Unmute" class="p-1.5 rounded-md hover:bg-forge-surface text-gray-300 hover:text-white transition">
              <i id="muteIcon" data-lucide="volume-2" class="w-4 h-4"></i>
            </button>
            <button id="toggleInspectorBtn" title="Toggle Inspector" class="lg:hidden p-1.5 rounded-md hover:bg-forge-surface text-gray-300 hover:text-white transition">
              <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      </main>

      <!-- RIGHT INSPECTOR PANEL -->
      <aside id="inspectorPanel" class="hidden lg:flex fixed lg:static right-0 top-12 bottom-0 z-40 w-full sm:w-80 lg:w-72 shrink-0 bg-forge-panel border-l border-forge-border flex-col min-h-0">
        <div class="h-10 px-3 border-b border-forge-border flex items-center justify-between shrink-0">
          <span class="text-xs font-semibold uppercase tracking-wider text-gray-400">Inspector</span>
          <div class="flex items-center gap-2">
            <span id="inspectorTypeBadge" class="text-[10px] px-2 py-0.5 rounded-full bg-forge-surface text-forge-accent font-medium hidden">Clip</span>
            <button id="closeInspectorBtn" class="lg:hidden p-1 rounded-lg bg-forge-surface text-gray-300 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
        </div>
        <div id="inspectorContent" class="flex-1 p-3 overflow-y-auto space-y-4">
          <!-- Populated dynamically -->
        </div>
      </aside>
    </div>

    <!-- BOTTOM MULTI-TRACK TIMELINE -->
    <section class="h-52 sm:h-60 md:h-64 shrink-0 bg-forge-panel border-t border-forge-border flex flex-col min-h-0 pb-[env(safe-area-inset-bottom)]">
      <!-- Timeline Action Toolbar -->
      <div class="h-9 shrink-0 bg-forge-bg/60 border-b border-forge-border px-3 flex items-center justify-between gap-2">
        <div class="flex items-center gap-1">
          <button id="splitBtn" title="Split Clip at Playhead (S)" class="flex items-center gap-1.5 px-2.5 py-1 rounded text-xs font-medium bg-forge-surface hover:bg-forge-hover text-gray-200 border border-forge-border transition">
            <i data-lucide="scissors" class="w-3.5 h-3.5 text-forge-accent"></i>
            <span class="hidden sm:inline">Split</span>
          </button>
          <button id="duplicateBtn" title="Duplicate Selected Clip" class="flex items-center gap-1.5 px-2.5 py-1 rounded text-xs font-medium bg-forge-surface hover:bg-forge-hover text-gray-200 border border-forge-border transition">
            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
            <span class="hidden sm:inline">Duplicate</span>
          </button>
          <button id="deleteClipBtn" title="Delete Selected Clip (Del)" class="flex items-center gap-1.5 px-2.5 py-1 rounded text-xs font-medium bg-forge-surface hover:bg-rose-500/20 hover:text-rose-400 text-gray-300 border border-forge-border transition">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            <span class="hidden sm:inline">Delete</span>
          </button>
        </div>

        <div class="flex items-center gap-3">
          <button id="snapToggleBtn" title="Toggle Magnetic Snap" class="flex items-center gap-1 px-2 py-1 rounded text-xs font-medium bg-forge-accent/15 text-forge-accent border border-forge-accent/30 transition">
            <i data-lucide="magnet" class="w-3.5 h-3.5"></i>
            <span class="hidden sm:inline">Snap</span>

  <!-- TOAST CONTAINER -->

  <script>
    // =========================================================
    // CLIPFORGE STUDIO - CORE STATE & ENGINE
    // =========================================================

    const ASPECT_RATIOS = {
      '16:9': { w: 960, h: 540 },
      '9:16': { w: 405, h: 720 },
      '1:1':  { w: 600, h: 600 },
      '4:5':  { w: 480, h: 600 }
    };

    const FILTERS = [
      { id: 'none', name: 'Original', css: 'none', badge: '#374151' },
      { id: 'cinematic', name: 'Cinematic', css: 'contrast(1.15) saturate(0.88) brightness(0.95)', badge: '#0f766e' },
      { id: 'vintage', name: 'Warm Vintage', css: 'sepia(0.35) contrast(1.08) brightness(1.03)', badge: '#b45309' },
      { id: 'neon', name: 'Cyber Neon', css: 'saturate(1.65) contrast(1.2) hue-rotate(-12deg)', badge: '#7c3aed' },
      { id: 'noir', name: 'B&W Noir', css: 'grayscale(1) contrast(1.35)', badge: '#1f2937' },
      { id: 'vivid', name: 'Vivid Pop', css: 'saturate(1.45) contrast(1.1) brightness(1.05)', badge: '#db2777' },
      { id: 'dreamy', name: 'Dreamy Soft', css: 'brightness(1.08) saturate(1.15) blur(1.2px)', badge: '#ec4899' },
    ];

    const TRANSITIONS = [
      { id: 'none', name: 'None' },
      { id: 'fade', name: 'Crossfade' },
      { id: 'wipe', name: 'Wipe Left' },
      { id: 'zoom', name: 'Zoom In' },
      { id: 'flash', name: 'Flash White' }
    ];

    // Built-in procedural starter clips (copyright-free, rendered natively on canvas)
    const BUILTIN_MEDIA = [
      { id: 'demo_aurora', name: 'Aurora Waves', kind: 'procedural', preset: 'aurora', duration: 4.0, color: '#0d9488' },
      { id: 'demo_cyber', name: 'Synth Grid', kind: 'procedural', preset: 'cybergrid', duration: 4.0, color: '#7c3aed' },
      { id: 'demo_particles', name: 'Stardust Bokeh', kind: 'procedural', preset: 'particles', duration: 4.0, color: '#2563eb' },
      { id: 'demo_sunset', name: 'Golden Horizon', kind: 'procedural', preset: 'sunset', duration: 4.0, color: '#d97706' },
      { id: 'demo_sticker', name: 'REC Badge', kind: 'procedural', preset: 'recbadge', duration: 3.0, color: '#e11d48', defaultTrack: 'overlay' }
    ];

    const BUILTIN_AUDIO = [
      { id: 'aud_lofi', name: 'Lo-Fi Chill Beat', kind: 'synth', preset: 'lofi', bpm: 84, duration: 12.0 },
      { id: 'aud_synth', name: 'Synthwave Pulse', kind: 'synth', preset: 'synthwave', bpm: 112, duration: 12.0 },
      { id: 'aud_upbeat', name: 'Upbeat Pop Arp', kind: 'synth', preset: 'upbeat', bpm: 120, duration: 8.0 },
      { id: 'aud_whoosh', name: 'Transition Whoosh', kind: 'synth', preset: 'whoosh', bpm: 0, duration: 1.5 }
    ];

    const TEXT_PRESETS = [
      { id: 'txt_bold', name: 'Bold Title', text: 'CREATE WITHOUT LIMITS', fontSize: 54, color: '#ffffff', bgColor: 'transparent', animation: 'pop', yOffset: 0 },
      { id: 'txt_lower', name: 'Lower Third', text: 'ClipForge Studio • 60fps', fontSize: 28, color: '#0b0d12', bgColor: '#00d4aa', animation: 'slideUp', yOffset: 0.34 },
      { id: 'txt_neon', name: 'Neon Caption', text: 'NIGHTFALL EDITION', fontSize: 42, color: '#00f0c0', bgColor: 'rgba(11,13,18,0.65)', animation: 'fade', yOffset: -0.25 },
      { id: 'txt_sub', name: 'Clean Subtitle', text: 'Edit, trim, and export in your browser.', fontSize: 26, color: '#f3f4f6', bgColor: 'rgba(0,0,0,0.55)', animation: 'fade', yOffset: 0.36 }
    ];

    // App State
    const state = {
      activeTab: 'media',
      aspectRatio: '16:9',
      zoomPxPerSec: 70,
      snapEnabled: true,
      isPlaying: false,
      isMuted: false,
      isExporting: false,
      playhead: 1.2,
      selectedClipId: null,
      importedMedia: [],
      clips: [],
      history: [],
      redoStack: []
    };

    // Media Element Cache for uploaded videos/images/audio
    const mediaCache = new Map();

    // Web Audio Engine for procedural synth tracks & mute control
    let audioCtx = null;
    let masterGain = null;
    let synthInterval = null;
    let lastSynthStep = -1;

    function initAudioContext() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) {
          audioCtx = new AC();
          masterGain = audioCtx.createGain();
          masterGain.gain.value = state.isMuted ? 0 : 0.6;
          masterGain.connect(audioCtx.destination);
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Seed an immediately playable 3-clip project on launch
    function seedStarterProject() {
      state.clips = [
        createClipObject({
          track: 'video',
          name: 'Aurora Waves',
          mediaId: 'demo_aurora',
          kind: 'procedural',
          preset: 'aurora',
          start: 0,
          duration: 4.0,
          transition: 'none'
        }),
        createClipObject({
          track: 'video',
          name: 'Synth Grid',
          mediaId: 'demo_cyber',
          kind: 'procedural',
          preset: 'cybergrid',
          start: 4.0,
          duration: 4.0,
          filter: 'neon',
          transition: 'wipe'
        }),
        createClipObject({
          track: 'video',
          name: 'Stardust Bokeh',
          mediaId: 'demo_particles',
          kind: 'procedural',
          preset: 'particles',
          start: 8.0,
          duration: 4.0,
          transition: 'zoom'
        }),
        createClipObject({
          track: 'text',
          name: 'Bold Title',
          kind: 'text',
          text: 'CLIPFORGE STUDIO',
          fontSize: 52,
          color: '#ffffff',
          bgColor: 'transparent',
          animation: 'pop',
          yOffset: 0,
          start: 0.4,
          duration: 3.4
        }),
        createClipObject({
          track: 'text',
          name: 'Lower Third',
          kind: 'text',
          text: 'Trim • Filter • Export',
          fontSize: 26,
          color: '#0b0d12',
          bgColor: '#00d4aa',
          animation: 'slideUp',
          yOffset: 0.34,
          start: 4.3,
          duration: 3.4
        }),
        createClipObject({
          track: 'audio',
          name: 'Lo-Fi Chill Beat',
          mediaId: 'aud_lofi',
          kind: 'synth',
          preset: 'lofi',
          bpm: 84,
          start: 0,
          duration: 12.0,
          volume: 0.75
        })
      ];
      state.selectedClipId = state.clips[0].id;
    }

    function createClipObject(opts) {
      return {
        id: 'clip_' + Math.random().toString(36).slice(2, 9),
        track: opts.track || 'video',
        name: opts.name || 'Untitled Clip',
        mediaId: opts.mediaId || null,
        kind: opts.kind || 'procedural',
        preset: opts.preset || 'aurora',
        start: Math.max(0, Number(opts.start || 0)),
        duration: Math.max(0.4, Number(opts.duration || 3.0)),
        mediaOffset: Number(opts.mediaOffset || 0),
        speed: Number(opts.speed || 1),
        opacity: opts.opacity !== undefined ? opts.opacity : 1,
        scale: opts.scale !== undefined ? opts.scale : 1,
        rotation: opts.rotation !== undefined ? opts.rotation : 0,
        flipH: Boolean(opts.flipH),
        brightness: 100,
        contrast: 100,
        saturate: 100,
        blur: 0,
        filter: opts.filter || 'none',
        transition: opts.transition || 'none',
        volume: opts.volume !== undefined ? opts.volume : 0.85,
        // Text fields
        text: opts.text || 'Sample Text',
        fontSize: opts.fontSize || 42,
        color: opts.color || '#ffffff',
        bgColor: opts.bgColor || 'transparent',
        animation: opts.animation || 'fade',
        xOffset: opts.xOffset || 0,
        yOffset: opts.yOffset || 0,
        bpm: opts.bpm || 90
      };
    }

    // Undo / Redo History
    function pushHistory() {
      state.history.push(JSON.stringify(state.clips));
      if (state.history.length > 35) state.history.shift();
      state.redoStack = [];
      updateUndoRedoButtons();
    }

    function undo() {
      if (!state.history.length) return;
      state.redoStack.push(JSON.stringify(state.clips));
      state.clips = JSON.parse(state.history.pop());
      if (!state.clips.some(c => c.id === state.selectedClipId)) {
        state.selectedClipId = state.clips[0]?.id || null;
      }
      renderAll();
      showToast('Undid last action');
    }

    function redo() {
      if (!state.redoStack.length) return;
      state.history.push(JSON.stringify(state.clips));
      state.clips = JSON.parse(state.redoStack.pop());
      renderAll();
      showToast('Redid action');
    }

    function updateUndoRedoButtons() {
      document.getElementById('undoBtn').disabled = state.history.length === 0;
      document.getElementById('redoBtn').disabled = state.redoStack.length === 0;
    }

    function getTotalDuration() {
      if (!state.clips.length) return 10;
      const maxEnd = Math.max(...state.clips.map(c => c.start + c.duration));
      return Math.max(5, Math.ceil(maxEnd * 10) / 10);
    }

    function formatTime(sec) {
      const s = Math.max(0, sec);
      const mins = Math.floor(s / 60);
      const rem = (s % 60).toFixed(1).padStart(4, '0');
      return `${String(mins).padStart(2, '0')}:${rem}`;
    }

    function showToast(msg, type = 'info') {
      const wrap = document.getElementById('toastContainer');
      const el = document.createElement('div');
      const accent = type === 'error' ? 'border-rose-500 text-rose-200' : 'border-forge-accent/50 text-gray-100';
      el.className = `px-3.5 py-2 rounded-xl bg-forge-panel/95 border ${accent} text-xs font-medium shadow-xl backdrop-blur transition-all duration-200`;
      el.textContent = msg;
      wrap.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 220);
      }, 2200);
    }

    // =========================================================
    // PROCEDURAL & CANVAS RENDERING ENGINE
    // =========================================================
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');

    function setAspectRatio(ratio) {
      state.aspectRatio = ratio;
      const dim = ASPECT_RATIOS[ratio] || ASPECT_RATIOS['16:9'];
      canvas.width = dim.w;
      canvas.height = dim.h;
      document.getElementById('aspectBadge').textContent = ratio;
      document.querySelectorAll('.ratio-btn').forEach(btn => {
        const active = btn.dataset.ratio === ratio;
        btn.className = `ratio-btn px-2 py-1 text-[11px] font-medium rounded-md transition ${active ? 'bg-forge-accent text-forge-bg' : 'text-gray-400 hover:text-white'}`;
      });
      renderPreviewFrame(state.playhead);
    }

    function drawProceduralClip(c, localTime, w, h, targetCtx) {
      const t = localTime * c.speed;
      if (c.preset === 'aurora') {
        const grad = targetCtx.createLinearGradient(0, 0, w, h);
        grad.addColorStop(0, '#07141f');
        grad.addColorStop(0.5, '#0b2c38');
        grad.addColorStop(1, '#10182b');
        targetCtx.fillStyle = grad;
        targetCtx.fillRect(0, 0, w, h);

        for (let i = 0; i < 4; i++) {
          targetCtx.beginPath();
          const baseY = h * (0.35 + i * 0.12);
          targetCtx.moveTo(0, h);
          for (let x = 0; x <= w; x += 24) {
            const y = baseY + Math.sin(x * 0.008 + t * 2.1 + i * 1.3) * (h * 0.09) + Math.cos(x * 0.004 - t * 1.2) * 18;
            targetCtx.lineTo(x, y);
          }
          targetCtx.lineTo(w, h);
          targetCtx.closePath();
          targetCtx.fillStyle = i % 2 === 0 ? 'rgba(0, 212, 170, 0.22)' : 'rgba(124, 92, 255, 0.2)';
          targetCtx.fill();
        }
      } else if (c.preset === 'cybergrid') {
        targetCtx.fillStyle = '#090616';
        targetCtx.fillRect(0, 0, w, h);
        const horizon = h * 0.45;
        const sunGrad = targetCtx.createLinearGradient(0, horizon - 110, 0, horizon + 10);
        sunGrad.addColorStop(0, '#f43f5e');
        sunGrad.addColorStop(1, '#f59e0b');
        targetCtx.fillStyle = sunGrad;
        targetCtx.beginPath();
        targetCtx.arc(w / 2, horizon - 20, Math.min(w, h) * 0.18, 0, Math.PI * 2);
        targetCtx.fill();

        targetCtx.fillStyle = '#090616';
        targetCtx.fillRect(0, horizon, w, h - horizon);

        targetCtx.strokeStyle = 'rgba(0, 212, 170, 0.55)';
        targetCtx.lineWidth = 1.5;
        for (let i = -10; i <= 10; i++) {
          targetCtx.beginPath();
          targetCtx.moveTo(w / 2 + i * 18, horizon);
          targetCtx.lineTo(w / 2 + i * 140, h);
          targetCtx.stroke();
        }
        const offset = (t * 60) % 40;
        for (let y = horizon + offset; y < h; y += 34) {
          targetCtx.beginPath();
          targetCtx.moveTo(0, y);
          targetCtx.lineTo(w, y);
          targetCtx.stroke();
        }
      } else if (c.preset === 'particles') {
        const bg = targetCtx.createRadialGradient(w * 0.5, h * 0.5, 20, w * 0.5, h * 0.5, Math.max(w, h) * 0.7);
        bg.addColorStop(0, '#132042');
        bg.addColorStop(1, '#060913');
        targetCtx.fillStyle = bg;
        targetCtx.fillRect(0, 0, w, h);
        for (let i = 0; i < 36; i++) {
          const px = ((i * 197 + t * (28 + (i % 5) * 12)) % (w + 60)) - 30;
          const py = ((i * 113 + Math.sin(t * 1.5 + i) * 35) % h + h) % h;
          const r = 4 + (i % 6) * 4;
          targetCtx.beginPath();
          targetCtx.arc(px, py, r, 0, Math.PI * 2);
          targetCtx.fillStyle = i % 3 === 0 ? 'rgba(0, 212, 170, 0.35)' : i % 3 === 1 ? 'rgba(124, 92, 255, 0.35)' : 'rgba(56, 189, 248, 0.3)';
          targetCtx.fill();
        }
      } else if (c.preset === 'sunset') {
        const g = targetCtx.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, '#3b0764');
        g.addColorStop(0.55, '#db2777');
        g.addColorStop(1, '#f59e0b');
        targetCtx.fillStyle = g;
        targetCtx.fillRect(0, 0, w, h);
        targetCtx.fillStyle = 'rgba(255,255,255,0.12)';
        targetCtx.beginPath();
        targetCtx.arc(w * 0.5, h * 0.52 + Math.sin(t) * 8, Math.min(w, h) * 0.2, 0, Math.PI * 2);
        targetCtx.fill();
      } else if (c.preset === 'recbadge') {
        // Transparent overlay badge
        const pad = 22;
        targetCtx.fillStyle = 'rgba(11, 13, 18, 0.72)';
        targetCtx.beginPath();
        targetCtx.roundRect(pad, pad, 108, 36, 10);
        targetCtx.fill();
        const blink = Math.floor(t * 2) % 2 === 0;
        targetCtx.fillStyle = blink ? '#f43f5e' : '#881337';
        targetCtx.beginPath();
        targetCtx.arc(pad + 20, pad + 18, 6, 0, Math.PI * 2);
        targetCtx.fill();
        targetCtx.fillStyle = '#ffffff';
        targetCtx.font = 'bold 14px Inter, sans-serif';
        targetCtx.textBaseline = 'middle';
        targetCtx.fillText('REC • 4K', pad + 34, pad + 19);
      }
    }

    function drawVisualClip(c, time, w, h) {
      const localTime = Math.max(0, time - c.start);
      const filterObj = FILTERS.find(f => f.id === c.filter);
      const baseFilter = filterObj && filterObj.css !== 'none' ? filterObj.css + ' ' : '';
      const adjFilter = `brightness(${c.brightness}%) contrast(${c.contrast}%) saturate(${c.saturate}%) blur(${c.blur}px)`;

      ctx.save();
      ctx.globalAlpha = c.opacity;
      ctx.filter = baseFilter + adjFilter;

      // Transition in (first 0.6s of clip)
      const transDur = 0.6;
      if (c.transition !== 'none' && localTime < transDur) {
        const p = localTime / transDur;
        if (c.transition === 'fade') {
          ctx.globalAlpha *= p;
        } else if (c.transition === 'wipe') {
          ctx.beginPath();
          ctx.rect(0, 0, w * p, h);
          ctx.clip();
        } else if (c.transition === 'zoom') {
          const z = 0.75 + 0.25 * p;
          ctx.translate(w / 2, h / 2);
          ctx.scale(z, z);
          ctx.translate(-w / 2, -h / 2);
        }
      }

      // Apply clip transform (scale, rotation & flip)
      if (c.scale !== 1 || c.rotation !== 0 || c.flipH) {
        ctx.translate(w / 2, h / 2);
        ctx.rotate((c.rotation * Math.PI) / 180);
        ctx.scale(c.scale * (c.flipH ? -1 : 1), c.scale);
        ctx.translate(-w / 2, -h / 2);
      }

      if (c.kind === 'procedural') {
        drawProceduralClip(c, localTime, w, h, ctx);
      } else if (c.kind === 'image') {
        const img = mediaCache.get(c.mediaId);
        if (img && img.complete) {
          const imgRatio = img.width / img.height;
          const canvasRatio = w / h;
          let dw = w, dh = h, dx = 0, dy = 0;
          if (imgRatio > canvasRatio) {
            dh = h;
            dw = h * imgRatio;
            dx = (w - dw) / 2;
          } else {
            dw = w;
            dh = w / imgRatio;
            dy = (h - dh) / 2;
          }
          ctx.drawImage(img, dx, dy, dw, dh);
        }
      } else if (c.kind === 'video') {
        const vid = mediaCache.get(c.mediaId);
        if (vid && vid.readyState >= 2) {
          const targetVidTime = Math.min(vid.duration || 10, c.mediaOffset + localTime * c.speed);
          if (Math.abs(vid.currentTime - targetVidTime) > 0.12 && !state.isPlaying) {
            vid.currentTime = targetVidTime;
          }
          const vRatio = vid.videoWidth / (vid.videoHeight || 1);
          const cRatio = w / h;
          let dw = w, dh = h, dx = 0, dy = 0;
          if (vRatio > cRatio) {
            dh = h; dw = h * vRatio; dx = (w - dw) / 2;
          } else {
            dw = w; dh = w / vRatio; dy = (h - dh) / 2;
          }
          ctx.drawImage(vid, dx, dy, dw, dh);
        }
      }

      ctx.restore();

      // Flash white transition overlay
      if (c.transition === 'flash' && localTime < 0.35) {
        ctx.save();
        ctx.fillStyle = `rgba(255,255,255,${1 - localTime / 0.35})`;
        ctx.fillRect(0, 0, w, h);
        ctx.restore();
      }
    }

    function drawTextClip(c, time, w, h) {
      const localTime = Math.max(0, time - c.start);
      ctx.save();
      let alpha = c.opacity;
      let yAnim = 0;
      let scaleAnim = 1;

      if (c.animation === 'fade' && localTime < 0.4) {
        alpha *= localTime / 0.4;
      } else if (c.animation === 'slideUp' && localTime < 0.4) {
        const p = localTime / 0.4;
        alpha *= p;
        yAnim = (1 - p) * 28;
      } else if (c.animation === 'pop' && localTime < 0.35) {
        const p = localTime / 0.35;
        scaleAnim = 0.6 + 0.4 * Math.sin(p * Math.PI * 0.5);
      }

      ctx.globalAlpha = alpha;
      const scaleFactor = w / 960;
      const fontSize = Math.max(14, Math.round(c.fontSize * scaleFactor));
      ctx.font = `700 ${fontSize}px Inter, system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const cx = w / 2 + (c.xOffset || 0) * w;
      const cy = h / 2 + (c.yOffset || 0) * h + yAnim;

      ctx.translate(cx, cy);
      ctx.scale(scaleAnim * c.scale, scaleAnim * c.scale);

      const textStr = c.text || '';
      const metrics = ctx.measureText(textStr);
      const padX = 20 * scaleFactor;
      const padY = 12 * scaleFactor;

      if (c.bgColor && c.bgColor !== 'transparent') {
        ctx.fillStyle = c.bgColor;
        ctx.beginPath();
        ctx.roundRect(-metrics.width / 2 - padX, -fontSize / 2 - padY / 2, metrics.width + padX * 2, fontSize + padY, 10 * scaleFactor);
        ctx.fill();
      }

      ctx.shadowColor = 'rgba(0,0,0,0.65)';
      ctx.shadowBlur = 10;
      ctx.fillStyle = c.color || '#ffffff';
      ctx.fillText(textStr, 0, 0);
      ctx.restore();
    }

    function renderPreviewFrame(time) {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#05070a';
      ctx.fillRect(0, 0, w, h);

      // 1. Main Video Track (V1)
      const videoClips = state.clips.filter(c => c.track === 'video' && time >= c.start && time <= c.start + c.duration);
      videoClips.forEach(c => drawVisualClip(c, time, w, h));

      // 2. Overlay Track (V2)
      const overlayClips = state.clips.filter(c => c.track === 'overlay' && time >= c.start && time <= c.start + c.duration);
      overlayClips.forEach(c => drawVisualClip(c, time, w, h));

      // 3. Text Track (T)
      const textClips = state.clips.filter(c => c.track === 'text' && time >= c.start && time <= c.start + c.duration);
      textClips.forEach(c => drawTextClip(c, time, w, h));
    }

    // =========================================================
    // WEB AUDIO SYNTHESIZER FOR BUILT-IN AUDIO TRACKS
    // =========================================================
    function triggerSynthStep(time) {
      if (!state.isPlaying || state.isMuted || !audioCtx) return;
      const activeAudio = state.clips.filter(c => c.track === 'audio' && time >= c.start && time <= c.start + c.duration);
      if (!activeAudio.length) return;

      const step = Math.floor(time * 4); // 16th-ish step every 0.25s
      if (step === lastSynthStep) return;
      lastSynthStep = step;

      activeAudio.forEach(c => {
        if (c.kind !== 'synth') return;
        const now = audioCtx.currentTime;
        const vol = (c.volume || 0.7) * 0.22;

        if (c.preset === 'lofi') {
          const notes = [261.63, 329.63, 392.0, 493.88, 220.0, 261.63, 329.63, 392.0];
          if (step % 2 === 0) {
            playTone(notes[(step / 2) % notes.length], 'triangle', 0.35, vol, now);
          }
          if (step % 4 === 0) {
            playTone(65, 'sine', 0.14, vol * 1.3, now);
          }
        } else if (c.preset === 'synthwave') {
          const bass = [110, 110, 130.81, 146.83, 98, 98, 123.47, 130.81];
          playTone(bass[step % bass.length], 'sawtooth', 0.16, vol * 0.65, now);
        } else if (c.preset === 'upbeat') {
          const arp = [440, 554.37, 659.25, 880, 659.25, 554.37];
          playTone(arp[step % arp.length], 'sine', 0.14, vol * 0.8, now);
        } else if (c.preset === 'whoosh' && time - c.start < 0.3) {
          playTone(180 + (time - c.start) * 400, 'sine', 0.3, vol, now);
        }
      });
    }

    function playTone(freq, type, dur, vol, startTime) {
      if (!audioCtx || !masterGain) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, startTime);
      gain.gain.setValueAtTime(0.001, startTime);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.002, vol), startTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);
      osc.connect(gain);
      gain.connect(masterGain);
      osc.start(startTime);
      osc.stop(startTime + dur + 0.02);
    }

    // =========================================================
    // PLAYBACK LOOP
    // =========================================================
    let rafId = null;
    let lastFrameTs = 0;

    function togglePlay() {
      initAudioContext();
      state.isPlaying = !state.isPlaying;
      if (state.isPlaying) {
        if (state.playhead >= getTotalDuration()) state.playhead = 0;
        lastFrameTs = performance.now();
        syncVideosPlayback(true);
        rafId = requestAnimationFrame(playbackTick);
      } else {
        cancelAnimationFrame(rafId);
        syncVideosPlayback(false);
      }
      updatePlayPauseUI();
    }

    function syncVideosPlayback(playing) {
      mediaCache.forEach(el => {
        if (el.tagName === 'VIDEO' || el.tagName === 'AUDIO') {
          if (playing) {
            el.muted = state.isMuted;
            el.play().catch(() => {});
          } else {
            el.pause();
          }
        }
      });
    }

    function playbackTick(ts) {
      if (!state.isPlaying) return;
      const dt = Math.min(0.1, (ts - lastFrameTs) / 1000);
      lastFrameTs = ts;
      state.playhead += dt;
      const total = getTotalDuration();

      if (state.playhead >= total) {
        state.playhead = total;
        state.isPlaying = false;
        syncVideosPlayback(false);
        updatePlayPauseUI();
        updatePlayheadUI();
        renderPreviewFrame(state.playhead);
        return;
      }

      triggerSynthStep(state.playhead);
      updatePlayheadUI();
      renderPreviewFrame(state.playhead);
      rafId = requestAnimationFrame(playbackTick);
    }

    function updatePlayPauseUI() {
      const icon = document.getElementById('playPauseIcon');
      icon.setAttribute('data-lucide', state.isPlaying ? 'pause' : 'play');
      lucide.createIcons();
    }

    function updatePlayheadUI() {
      const px = state.playhead * state.zoomPxPerSec;
      document.getElementById('playhead').style.left = `${px}px`;
      document.getElementById('currentTimeDisplay').textContent = formatTime(state.playhead);
      document.getElementById('totalDurationDisplay').textContent = formatTime(getTotalDuration());
    }

    // =========================================================
    // ADDING CLIPS & LOCAL MEDIA IMPORT
    // =========================================================
    function findTrackAppendTime(track) {
      const laneClips = state.clips.filter(c => c.track === track);
      if (!laneClips.length) return 0;
      return Math.max(...laneClips.map(c => c.start + c.duration));
    }

    function addBuiltinClipToTimeline(id) {
      const m = BUILTIN_MEDIA.find(x => x.id === id);
      if (!m) return;
      pushHistory();
      const track = m.defaultTrack || 'video';
      const start = track === 'overlay' ? state.playhead : findTrackAppendTime(track);
      const clip = createClipObject({
        track,
        name: m.name,
        mediaId: m.id,
        kind: 'procedural',
        preset: m.preset,
        start,
        duration: m.duration
      });
      state.clips.push(clip);
      state.selectedClipId = clip.id;
      renderAll();
      showToast(`Added "${m.name}" to ${track}`);
    }

    function addImportedClipToTimeline(id) {
      const m = state.importedMedia.find(x => x.id === id);
      if (!m) return;
      pushHistory();
      const track = m.kind === 'audio' ? 'audio' : 'video';
      const start = findTrackAppendTime(track);
      const clip = createClipObject({
        track,
        name: m.name,
        mediaId: m.id,
        kind: m.kind,
        start,
        duration: m.duration
      });
      state.clips.push(clip);
      state.selectedClipId = clip.id;
      renderAll();
      showToast(`Added "${m.name}"`);
    }

    function addAudioToTimeline(id) {
      const a = BUILTIN_AUDIO.find(x => x.id === id);
      if (!a) return;
      pushHistory();
      const clip = createClipObject({
        track: 'audio',
        name: a.name,
        mediaId: a.id,
        kind: 'synth',
        preset: a.preset,
        bpm: a.bpm,
        start: state.playhead,
        duration: a.duration
      });
      state.clips.push(clip);
      state.selectedClipId = clip.id;
      renderAll();
      showToast(`Added "${a.name}" to Audio`);
    }

    function addTextPresetToTimeline(id) {
      const p = TEXT_PRESETS.find(x => x.id === id);
      if (!p) return;
      pushHistory();
      const clip = createClipObject({
        track: 'text',
        name: p.name,
        kind: 'text',
        text: p.text,
        fontSize: p.fontSize,
        color: p.color,
        bgColor: p.bgColor,
        animation: p.animation,
        yOffset: p.yOffset,
        start: state.playhead,
        duration: 3.0
      });
      state.clips.push(clip);
      state.selectedClipId = clip.id;
      renderAll();
      showToast(`Added "${p.name}"`);
    }

    function handleMediaUpload(files) {
      Array.from(files).forEach(file => {
        const url = URL.createObjectURL(file);
        const id = 'imp_' + Math.random().toString(36).slice(2, 9);
        if (file.type.startsWith('image/')) {
          const img = new Image();
          img.onload = () => {
            mediaCache.set(id, img);
            state.importedMedia.push({ id, name: file.name, kind: 'image', duration: 4.0 });
            renderDock();
            showToast(`Imported ${file.name}`);
          };
          img.src = url;
        } else if (file.type.startsWith('video/')) {
          const vid = document.createElement('video');
          vid.preload = 'metadata';
          vid.onloadedmetadata = () => {
            mediaCache.set(id, vid);
            state.importedMedia.push({ id, name: file.name, kind: 'video', duration: Math.min(30, vid.duration || 5) });
            renderDock();
            showToast(`Imported ${file.name}`);
          };
          vid.src = url;
        } else if (file.type.startsWith('audio/')) {
          const aud = new Audio(url);
          aud.onloadedmetadata = () => {
            mediaCache.set(id, aud);
            state.importedMedia.push({ id, name: file.name, kind: 'audio', duration: Math.min(60, aud.duration || 10) });
            renderDock();
            showToast(`Imported ${file.name}`);
          };
        }
      });
    }

    // =========================================================
    // INSPECTOR PANEL
    // =========================================================
    function getSelectedClip() {
      return state.clips.find(c => c.id === state.selectedClipId) || null;
    }

    function renderInspector() {
      const container = document.getElementById('inspectorContent');
      const badge = document.getElementById('inspectorTypeBadge');
      const clip = getSelectedClip();

      if (!clip) {
        badge.classList.add('hidden');
        container.innerHTML = `

            <p class="text-xs">Select any clip on the timeline to inspect and customize its properties.</p>

        `;
        lucide.createIcons();
        return;
      }

      badge.classList.remove('hidden');
      badge.textContent = clip.track.toUpperCase();

    // =========================================================
    // TIMELINE RENDERING & DIRECT MANIPULATION
    // =========================================================
    function renderTimelineRuler() {
      const total = Math.max(16, getTotalDuration() + 4);
      const widthPx = Math.max(900, Math.ceil(total * state.zoomPxPerSec));
      document.getElementById('timelineInner').style.width = `${widthPx}px`;

      const ruler = document.getElementById('timeRuler');
      ruler.innerHTML = '';
      const stepSec = state.zoomPxPerSec < 50 ? 2 : 1;
      for (let s = 0; s <= total; s += stepSec) {
        const tick = document.createElement('div');
        tick.className = 'absolute top-0 bottom-0 border-l border-forge-border text-[9px] font-mono text-gray-500 pl-1 pt-0.5 pointer-events-none';
        tick.style.left = `${s * state.zoomPxPerSec}px`;
        tick.textContent = `${s}s`;
        ruler.appendChild(tick);
      }
    }

    function renderTimelineClips() {
      const trackColors = {
        text: 'bg-purple-600/35 border-purple-400/60 text-purple-100',
        video: 'bg-teal-600/35 border-teal-400/60 text-teal-100',
        overlay: 'bg-sky-600/35 border-sky-400/60 text-sky-100',
        audio: 'bg-amber-600/35 border-amber-400/60 text-amber-100'
      };

      document.querySelectorAll('.track-lane').forEach(lane => {
        const trackName = lane.dataset.track;
        lane.innerHTML = '';
        const laneClips = state.clips.filter(c => c.track === trackName);

        laneClips.forEach(clip => {
          const el = document.createElement('div');
          const isSelected = clip.id === state.selectedClipId;
          el.className = `timeline-clip absolute top-1 bottom-1 rounded-md border px-2 flex items-center justify-between cursor-grab active:cursor-grabbing overflow-hidden ${trackColors[trackName]} ${isSelected ? 'selected' : ''}`;
          el.style.left = `${clip.start * state.zoomPxPerSec}px`;
          el.style.width = `${Math.max(24, clip.duration * state.zoomPxPerSec)}px`;
          el.dataset.clipId = clip.id;

          el.innerHTML = `
            <div class="clip-handle trim-left absolute left-0 top-0 bottom-0 w-3.5 md:w-2 bg-white/30 hover:bg-forge-accent cursor-ew-resize"></div>
            <span class="text-[11px] font-medium truncate pointer-events-none px-1">${clip.track === 'text' ? clip.text : clip.name}</span>
            <span class="text-[9px] font-mono opacity-70 pointer-events-none shrink-0">${clip.duration.toFixed(1)}s</span>
            <div class="clip-handle trim-right absolute right-0 top-0 bottom-0 w-3.5 md:w-2 bg-white/30 hover:bg-forge-accent cursor-ew-resize"></div>
          `;

          // Drag / Trim / Select handling
          el.addEventListener('pointerdown', e => startClipInteraction(e, clip));
          lane.appendChild(el);
        });
      });
    }

    function startClipInteraction(e, clip) {
      e.stopPropagation();
      state.selectedClipId = clip.id;
      renderTimelineClips();
      renderInspector();
      if (state.activeTab === 'filters' || state.activeTab === 'transitions') renderDock();

      const isLeftTrim = e.target.classList.contains('trim-left');
      const isRightTrim = e.target.classList.contains('trim-right');
      const startX = e.clientX;
      const origStart = clip.start;
      const origDur = clip.duration;
      let mutated = false;

      const onMove = ev => {
        const dxSec = (ev.clientX - startX) / state.zoomPxPerSec;
        if (Math.abs(dxSec) > 0.02 && !mutated) {
          pushHistory();
          mutated = true;
        }
        if (isLeftTrim) {
          const maxShift = origDur - 0.4;
          const shift = Math.min(maxShift, Math.max(-origStart, dxSec));
          clip.start = Math.round((origStart + shift) * 10) / 10;
          clip.duration = Math.round((origDur - shift) * 10) / 10;
        } else if (isRightTrim) {
          clip.duration = Math.max(0.4, Math.round((origDur + dxSec) * 10) / 10);
        } else {
          let nextStart = Math.max(0, origStart + dxSec);
          if (state.snapEnabled) {
            const snapTargets = [0, state.playhead, ...state.clips.filter(c => c.id !== clip.id).flatMap(c => [c.start, c.start + c.duration])];
            for (const target of snapTargets) {
              if (Math.abs(nextStart - target) < 0.18) { nextStart = target; break; }
            }
          }
          clip.start = Math.round(nextStart * 10) / 10;
        }
        renderTimelineClips();
        updatePlayheadUI();
        renderPreviewFrame(state.playhead);
      };

      const onUp = () => {
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('pointercancel', onUp);
        if (mutated) renderInspector();
      };
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
    }

    // Playhead Scrubbing
    function initTimelineScrubbing() {
      const ruler = document.getElementById('timeRuler');
      const handle = document.getElementById('playheadHandle');
      const timelineInner = document.getElementById('timelineInner');

      const scrubToClientX = clientX => {
        const rect = timelineInner.getBoundingClientRect();
        const x = Math.max(0, clientX - rect.left);
        state.playhead = Math.max(0, Math.min(getTotalDuration(), x / state.zoomPxPerSec));
        updatePlayheadUI();
        renderPreviewFrame(state.playhead);
      };

      const startScrub = e => {
        e.preventDefault();
        if (state.isPlaying) togglePlay();
        scrubToClientX(e.clientX);
        const onMove = ev => scrubToClientX(ev.clientX);
        const onUp = () => {
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
        };
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
      };

      ruler.addEventListener('pointerdown', startScrub);
      handle.addEventListener('pointerdown', startScrub);
    }

    // =========================================================
    // TIMELINE ACTIONS (SPLIT, DUPLICATE, DELETE)
    // =========================================================
    function splitSelectedClip() {
      const clip = getSelectedClip();
      if (!clip) {
        showToast('Select a clip to split', 'error');
        return;
      }
      if (state.playhead <= clip.start + 0.2 || state.playhead >= clip.start + clip.duration - 0.2) {
        showToast('Move playhead inside the selected clip to split', 'error');
        return;
      }
      pushHistory();
      const firstDur = Math.round((state.playhead - clip.start) * 10) / 10;
      const secondDur = Math.round((clip.duration - firstDur) * 10) / 10;

      clip.duration = firstDur;
      const secondClip = createClipObject({
        ...clip,
        start: state.playhead,
        duration: secondDur,
        mediaOffset: (clip.mediaOffset || 0) + firstDur * clip.speed,
        transition: 'none'
      });
      state.clips.push(secondClip);
      state.selectedClipId = secondClip.id;
      renderAll();
      showToast('Clip split at playhead');
    }

    function duplicateSelectedClip() {
      const clip = getSelectedClip();
      if (!clip) return;
      pushHistory();
      const copy = createClipObject({
        ...clip,
        start: clip.start + clip.duration,
        name: clip.name + ' (Copy)'
      });
      state.clips.push(copy);
      state.selectedClipId = copy.id;
      renderAll();
      showToast('Clip duplicated');
    }

    function deleteSelectedClip() {
      const clip = getSelectedClip();
      if (!clip) return;
      pushHistory();
      state.clips = state.clips.filter(c => c.id !== clip.id);
      state.selectedClipId = state.clips[0]?.id || null;
      renderAll();
      showToast('Clip deleted');
    }

    // =========================================================
    // REAL VIDEO EXPORT ENGINE (MediaRecorder on Canvas)
    // =========================================================
    async function exportVideoToWebm() {
      if (state.isExporting) return;
      if (typeof canvas.captureStream !== 'function' || typeof MediaRecorder === 'undefined') {
        showToast('Browser does not support canvas video recording', 'error');
        return;
      }

      if (state.isPlaying) togglePlay();
      state.isExporting = true;

      const progressWrap = document.getElementById('exportProgressWrap');
      const progressBar = document.getElementById('exportProgressBar');
      const progressPct = document.getElementById('exportProgressPct');
      const startBtn = document.getElementById('startExportBtn');
      progressWrap.classList.remove('hidden');
      startBtn.disabled = true;

      const fps = Number(document.getElementById('exportFps').value) || 30;
      const filename = (document.getElementById('exportFilename').value || 'ClipForge_Export').trim();
      const totalDur = getTotalDuration();

      const stream = canvas.captureStream(fps);
      const candidates = ['video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
      const mimeType = candidates.find(t => MediaRecorder.isTypeSupported(t)) || 'video/webm';
      const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';

      const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 3500000 });
      const chunks = [];
      recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };

      recorder.onstop = async () => {
        const blob = new Blob(chunks, { type: mimeType });
        await shareOrDownloadBlob(blob, `${filename}.${ext}`, mimeType);

        state.isExporting = false;
        startBtn.disabled = false;
        progressWrap.classList.add('hidden');
        document.getElementById('exportModal').classList.add('hidden');
        document.getElementById('exportModal').classList.remove('flex');
      };

      recorder.start();
      const frameStep = 1 / fps;
      let simTime = 0;

      const stepRender = () => {
        if (!state.isExporting) return;
        renderPreviewFrame(simTime);
        const pct = Math.min(100, Math.round((simTime / totalDur) * 100));
        progressBar.style.width = `${pct}%`;
        progressPct.textContent = `${pct}%`;

        simTime += frameStep;
        if (simTime <= totalDur) {
          setTimeout(stepRender, 1000 / fps);
        } else {
          recorder.stop();
        }
      };
      stepRender();
    }

    async function shareOrDownloadBlob(blob, fullFilename, mimeType) {
      const file = new File([blob], fullFilename, { type: mimeType });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: fullFilename });
          showToast(`Shared ${fullFilename} — tap Save to Photos!`);
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;
        }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fullFilename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast(`Downloaded ${fullFilename}`);
    }

    function exportCurrentPhotoPng() {
      const filename = (document.getElementById('exportFilename').value || 'ClipForge_Photo').trim();
      renderPreviewFrame(state.playhead);
      canvas.toBlob(async blob => {
        if (!blob) return;
        await shareOrDownloadBlob(blob, `${filename}.png`, 'image/png');
        document.getElementById('exportModal').classList.add('hidden');
        document.getElementById('exportModal').classList.remove('flex');
      }, 'image/png');
    }

    const STORAGE_KEY = 'clipforge_projects_v1';

    function loadSavedProjects() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return [
        {
          id: 'proj_starter',
          title: 'Neon Launch Reel',
          aspectRatio: '16:9',
          updatedAt: 'Starter Project',
          clips: null // null means seedStarterProject
        }
      ];
    }

    function saveCurrentProjectToList() {
      const projects = loadSavedProjects();
      const title = (document.getElementById('projectTitleInput').value || 'Untitled Project').trim();
      const existingIdx = projects.findIndex(p => p.id === state.currentProjectId);
      const entry = {
        id: state.currentProjectId || ('proj_' + Math.random().toString(36).slice(2, 8)),
        title,
        aspectRatio: state.aspectRatio,
        updatedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        clips: state.clips
      };
      state.currentProjectId = entry.id;
      if (existingIdx >= 0) projects[existingIdx] = entry;
      else projects.unshift(entry);
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(projects.slice(0, 12)));
      } catch (e) {}
    }

            state.clips = proj.clips;
            state.selectedClipId = state.clips[0].id;
          } else {
            seedStarterProject();
          }
          state.playhead = Math.min(1.2, getTotalDuration());
          openStudioView();
        });
      });
      lucide.createIcons();
    }

    function launchToolFromHome(tool) {
      state.currentProjectId = 'proj_' + Math.random().toString(36).slice(2, 8);
      seedStarterProject();
      state.playhead = 1.2;
      if (tool === 'poster') {
        document.getElementById('projectTitleInput').value = 'Poster FX Edit';
        setAspectRatio('9:16');
        state.activeTab = 'filters';
      } else if (tool === 'textcard') {
        document.getElementById('projectTitleInput').value = 'Kinetic Text Card';
        setAspectRatio('9:16');
        state.activeTab = 'text';
      } else if (tool === 'retouch') {
        document.getElementById('projectTitleInput').value = 'Color Retouch';
        state.activeTab = 'filters';
      } else if (tool === 'motion') {
        document.getElementById('projectTitleInput').value = 'Motion Reel';
        state.activeTab = 'media';
      } else if (tool === 'captions') {
        document.getElementById('projectTitleInput').value = 'Captioned Clip';
        state.activeTab = 'text';
      } else if (tool === 'photostudio') {
        document.getElementById('projectTitleInput').value = 'Photo Studio';
        setAspectRatio('1:1');
        state.activeTab = 'filters';
      } else if (tool === 'cover') {
        document.getElementById('projectTitleInput').value = 'Cover Maker';
        setAspectRatio('4:5');
        state.activeTab = 'text';
      } else {
        document.getElementById('projectTitleInput').value = 'New Video Project';
        setAspectRatio('16:9');
        state.activeTab = 'media';
      }
      openStudioView();
    }

    window.addEventListener('DOMContentLoaded', () => {
      seedStarterProject();
      renderAll();
      renderHomeProjects();

      document.getElementById('backToHomeBtn').addEventListener('click', openHomeView);
      document.getElementById('homeNewVideoBtn').addEventListener('click', () => launchToolFromHome('quickcut'));
      document.getElementById('homeNewProjectChip').addEventListener('click', () => launchToolFromHome('quickcut'));
      document.getElementById('homeEditPhotoBtn').addEventListener('click', () => {
        launchToolFromHome('photostudio');
        document.getElementById('mediaFileInput').click();
      });
      document.querySelectorAll('[data-home-tool]').forEach(btn => {
        btn.addEventListener('click', () => launchToolFromHome(btn.dataset.homeTool));
      });
      document.getElementById('homeSearchToggleBtn').addEventListener('click', () => {
        const w = document.getElementById('homeSearchWrap');
        w.classList.toggle('hidden');
        if (!w.classList.contains('hidden')) document.getElementById('homeSearchInput').focus();
      });
      document.getElementById('homeSearchInput').addEventListener('input', e => {
        renderHomeProjects(e.target.value);
      });
      document.getElementById('homeSettingsBtn').addEventListener('click', () => {
        showToast('ClipForge Studio • Local Browser Engine');
      });
      document.getElementById('homeAllToolsBtn').addEventListener('click', () => {
        launchToolFromHome('timeline');
        showToast('Opened full ClipForge Studio');
      });
      initTimelineScrubbing();

      // Dock Tabs
      document.querySelectorAll('.dock-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          state.activeTab = btn.dataset.tab;
          renderDock();
        });
      });

      // Aspect Ratios
      document.querySelectorAll('.ratio-btn').forEach(btn => {
        btn.addEventListener('click', () => setAspectRatio(btn.dataset.ratio));
      });

      // Transport & Timeline Controls
      document.getElementById('playPauseBtn').addEventListener('click', togglePlay);
      document.getElementById('jumpStartBtn').addEventListener('click', () => {
        state.playhead = 0;
        updatePlayheadUI();
        renderPreviewFrame(0);
      });
      document.getElementById('jumpEndBtn').addEventListener('click', () => {
        state.playhead = getTotalDuration();
        updatePlayheadUI();
        renderPreviewFrame(state.playhead);
      });
      document.getElementById('muteBtn').addEventListener('click', () => {
        state.isMuted = !state.isMuted;
        if (masterGain) masterGain.gain.value = state.isMuted ? 0 : 0.6;
        document.getElementById('muteIcon').setAttribute('data-lucide', state.isMuted ? 'volume-x' : 'volume-2');
        lucide.createIcons();
      });

      document.getElementById('toggleInspectorBtn').addEventListener('click', () => {
        const panel = document.getElementById('inspectorPanel');
        panel.classList.toggle('hidden');
        panel.classList.toggle('flex');
      });
      document.getElementById('closeInspectorBtn').addEventListener('click', () => {
        const panel = document.getElementById('inspectorPanel');
        panel.classList.add('hidden');
        panel.classList.remove('flex');
      });
      document.getElementById('toggleDockBtn').addEventListener('click', () => {
        const dock = document.getElementById('assetDockPanel');
        dock.classList.remove('hidden');
        dock.classList.add('flex');
      });
      document.getElementById('closeDockBtn').addEventListener('click', () => {
        const dock = document.getElementById('assetDockPanel');
        dock.classList.add('hidden');
        dock.classList.remove('flex');
      });

      document.getElementById('splitBtn').addEventListener('click', splitSelectedClip);
      document.getElementById('duplicateBtn').addEventListener('click', duplicateSelectedClip);
      document.getElementById('deleteClipBtn').addEventListener('click', deleteSelectedClip);
      document.getElementById('undoBtn').addEventListener('click', undo);
      document.getElementById('redoBtn').addEventListener('click', redo);

      document.getElementById('snapToggleBtn').addEventListener('click', e => {
        state.snapEnabled = !state.snapEnabled;
        e.currentTarget.className = state.snapEnabled
          ? 'flex items-center gap-1 px-2 py-1 rounded text-xs font-medium bg-forge-accent/15 text-forge-accent border border-forge-accent/30 transition'
          : 'flex items-center gap-1 px-2 py-1 rounded text-xs font-medium bg-forge-surface text-gray-400 border border-forge-border transition';
      });

      document.getElementById('zoomSlider').addEventListener('input', e => {
        state.zoomPxPerSec = Number(e.target.value);
        renderTimelineRuler();
        renderTimelineClips();
        updatePlayheadUI();
      });

      document.getElementById('mediaFileInput').addEventListener('change', e => {
        if (e.target.files.length) handleMediaUpload(e.target.files);
        e.target.value = '';
      });

      // Export Modal
      const exportModal = document.getElementById('exportModal');
      document.getElementById('openExportBtn').addEventListener('click', () => {
        exportModal.classList.remove('hidden');
        exportModal.classList.add('flex');
      });
      const closeModal = () => {
        if (state.isExporting) state.isExporting = false;
        exportModal.classList.add('hidden');
        exportModal.classList.remove('flex');
      };
      document.getElementById('closeExportModalBtn').addEventListener('click', closeModal);
      document.getElementById('cancelExportBtn').addEventListener('click', closeModal);
      document.getElementById('startExportBtn').addEventListener('click', exportVideoToWebm);
      document.getElementById('exportPhotoBtn').addEventListener('click', exportCurrentPhotoPng);

      // Keyboard Shortcuts
      window.addEventListener('keydown', e => {
        if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
        if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
        if (e.key === 's' || e.key === 'S') splitSelectedClip();
        if (e.key === 'Delete' || e.key === 'Backspace') deleteSelectedClip();
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
      });

      lucide.createIcons();
    });
  </script>
</body>
</html>
